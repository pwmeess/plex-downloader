<!doctype html>
<html lang="{{ glang }}" data-theme="{{ theme }}">
<head>
{% include "_head.html" %}
  <title>{{ _("Guide") }} · Plex Downloader</title>
</head>
<body class="guide-page">
{% include "_icons.html" %}
<header class="wz-top guide-top">
  <div class="brand"><span class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></span>Plex Downloader</div>
  <span class="wz-title">{{ _("Guide") }}</span>
  <span class="spacer"></span>
  <nav class="guide-langs">
    <a href="/guide?lang=en" class="{{ 'on' if glang == 'en' else '' }}">EN</a>
    <a href="/guide?lang=pl" class="{{ 'on' if glang == 'pl' else '' }}">PL</a>
  </nav>
  <a class="btn-primary small guide-pdf" href="{{ url_for('static', filename='guide/plex-downloader-guide-' + glang + '.pdf') }}?v={{ version }}" download><svg class="i"><use href="#i-down"/></svg>PDF</a>
  {% if user %}<a class="btn-soft small" href="/">{{ _("Back to the panel") }}</a>{% endif %}
</header>
<main class="guide-wrap">
{{ content }}
</main>
<script>
  // a Copy button on every command block (works on http in the home network too)
  (() => {
    const label = {{ (_("Copy"))|tojson }}, done = {{ (_("Copied"))|tojson }};
    const copy = async (text) => {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* not a secure context */ }
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove(); return ok;
    };
    document.querySelectorAll(".guide-body pre").forEach((pre) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "guide-copy"; b.textContent = label;
      b.addEventListener("click", async () => {
        const ok = await copy(pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText);
        b.textContent = ok ? done : "✕"; setTimeout(() => { b.textContent = label; }, 1500);
      });
      pre.appendChild(b);
    });
  })();
</script>
<div class="foot-ver">Plex Downloader · {{ _("version") }} {{ version }}</div>
</body>
</html>
