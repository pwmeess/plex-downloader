<header class="topbar">
  <a class="brand" href="/" title="{{ _('Plex Downloader – home') }}">
    <span class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></span>
    <span class="brand-txt">
      <span class="t">Plex Downloader</span>
      <span class="brand-sub"><span class="dot" id="selfDot"></span><span id="hdrServer">…</span></span>
    </span>
  </a>

  <div class="hdr-status" id="plexStatus" aria-label="{{ _('Plex servers') }}"></div>

  <div class="spacer"></div>

  <div class="hdr-vpn" id="vpnStatus" aria-label="VPN"></div>
  {% if page == 'files' %}
  <a class="btn-ghost" href="/" title="{{ _('Downloads') }}"><svg class="i"><use href="#i-down"/></svg><span class="lbl">{{ _('Downloads') }}</span></a>
  {% else %}
  <a class="btn-ghost" href="/files" title="{{ _('File manager') }}"><svg class="i"><use href="#i-folder"/></svg><span class="lbl">{{ _('File manager') }}</span></a>
  {% endif %}
  <button class="btn-ghost" id="openSettings" type="button" title="{{ _('Settings') }}"><svg class="i"><use href="#i-gear"/></svg><span class="lbl">{{ _('Settings') }}</span></button>
  <button class="btn-soft" id="logoutBtn" type="button" title="{{ _('Log out') }}"><svg class="i"><use href="#i-logout"/></svg><span class="lbl">{{ _('Log out') }}</span></button>
</header>
