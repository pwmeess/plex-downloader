<!doctype html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head>
{% include "_head.html" %}
  <title>{{ _("File manager") }} · Plex Downloader</title>
</head>
<body class="fm-page">
{% include "_icons.html" %}
{% include "_header.html" %}

<main class="fm-wrap">
  <div class="fm-top">
    <h1>{{ _("File manager") }}
      <button type="button" class="info-i" data-tip="{{ _('Choose a disk and category in each column. Select movies and drag them to the other column (or use the Move button). On the same disk the move is instant. Between disks files are copied, verified with a SHA-256 checksum, and the original is removed only after a correct copy.') }}">i</button></h1>
    <div class="fm-top-actions">
      <button class="btn-soft small" type="button" id="thumbOpts"><svg class="i"><use href="#i-image"/></svg>{{ _("Poster options") }}</button>
      <button class="btn-soft small" type="button" id="fmReload"><svg class="i"><use href="#i-retry"/></svg>{{ _("Refresh") }}</button>
    </div>
  </div>

  <section class="card fm-ops" id="fmOps" hidden>
    <div class="fm-ops-head"><b>{{ _("File operations") }}</b><button class="btn-ghost small" type="button" id="opsClear">{{ _("Clear finished") }}</button></div>
    <div id="opsList"></div>
  </section>

  <div class="fm-panes">
    <section class="card fm-pane" data-pane="left"></section>
    <section class="card fm-pane" data-pane="right"></section>
  </div>
</main>
<div class="foot-ver">Plex Downloader · {{ _("version") }} {{ version }}</div>

<template id="paneTpl">
  <div class="fm-disks"></div>
  <div class="segmented cats fm-cats"></div>
  <div class="fm-path mono"></div>
  <div class="fm-toolbar">
    <label class="fm-search"><svg class="i"><use href="#i-search"/></svg><input type="search" placeholder="{{ _('Search title…') }}"></label>
    <label class="check fm-all"><input type="checkbox"> {{ _("Select page") }}</label>
  </div>
  <div class="fm-selbar" hidden>
    <span class="fm-selinfo"></span>
    <span class="spacer"></span>
    <button class="btn-soft small fm-move" type="button"></button>
    <button class="btn-soft small btn-danger fm-del" type="button"><svg class="i"><use href="#i-trash"/></svg>{{ _("Delete") }}</button>
  </div>
  <div class="fm-grid" tabindex="-1"><div class="fm-drop-hint"></div></div>
  <div class="fm-pager"></div>
</template>

{% include "_settings.html" %}

<script src="{{ url_for('static', filename='common.js') }}?v={{ version }}"></script>
<script src="{{ url_for('static', filename='settings.js') }}?v={{ version }}"></script>
<script src="{{ url_for('static', filename='files.js') }}?v={{ version }}"></script>
</body>
</html>
